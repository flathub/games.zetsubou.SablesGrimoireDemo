app-id: games.zetsubou.SablesGrimoireDemo
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: SablesGrimoire.sh
tags:
  - proprietary
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio
  - --persist=.renpy
modules:
  - name: hmp
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin/
      - cp -R * /app/bin/
      - install -Dm644 -t "/app/share/metainfo/" games.zetsubou.SablesGrimoireDemo.metainfo.xml
      - install -Dm644 -t "/app/share/applications/" games.zetsubou.SablesGrimoireDemo.desktop
      - install -Dm644 games.zetsubou.SablesGrimoireDemo.png "/app/share/icons/hicolor/512x512/apps/games.zetsubou.SablesGrimoireDemo.png"
    sources:
      - type: archive
        url: https://gitlab.com/zetsubougames-builds/sables-grimoire-demo/-/releases/v1.10.0/downloads/sables-grimoire-demo-linux-amd64.zip
        sha512: 3d294f63b6017c5a601a99d090883e885044a4b1de51faf343f5a0057ee053eaf9544bd935470083d4df8184c497cbe46a33aeeed75fadbe36d13f1aafe9a1fd
        only-arches:
          - x86_64
      - type: archive
        url: https://gitlab.com/zetsubougames-builds/sables-grimoire-demo/-/releases/v1.10.0/downloads/sables-grimoire-demo-linux-aarch64.zip
        sha512: 5673ef8c634a02ec5842ee71db9aedac71155337f3fd16e86d95941b1ca4fee6b7a087d7b53f5bd7725e3f14a234f57a4d7abbecfd293f0b9a63c2d3084518ee
        only-arches:
          - aarch64
      - type: file
        path: games.zetsubou.SablesGrimoireDemo.desktop
      - type: file
        path: games.zetsubou.SablesGrimoireDemo.png
      - type: file
        path: games.zetsubou.SablesGrimoireDemo.metainfo.xml
